name: Daily AI Knowledge Collection

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python pipeline/pipeline.py --sources github,rss --limit 20 --verbose

      - name: Clean up invalid articles
        run: |
          python3 << 'EOF'
          import re
          import json
          from pathlib import Path

          articles_dir = Path("knowledge/articles")
          pattern = re.compile(r'^[a-z]+-\d{8}-\d{3}\.json$')

          for f in articles_dir.glob("*.json"):
            if not pattern.match(f.name):
              print(f"Removing invalid: {f.name}")
              f.unlink()
              continue

            try:
              data = json.load(open(f))
              if data.get("status") == "reviewed":
                data["status"] = "review"
                json.dump(data, open(f, "w"), ensure_ascii=False, indent=2)
                print(f"Fixed status in: {f.name}")
            except Exception as e:
              print(f"Error processing {f.name}: {e}")
          EOF

      - name: Validate collected articles
        run: |
          if ls knowledge/articles/*.json 1>/dev/null 2>&1; then
            python hooks/validate_json.py knowledge/articles/*.json
            python hooks/check_quality.py knowledge/articles/*.json
          else
            echo "No articles to validate"
          fi

      - name: Commit and push
        id: commit
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add -A

          if git diff --cached --quiet; then
            echo "no_changes=true" >> $GITHUB_OUTPUT
            echo "No new data to commit"
            exit 0
          fi

          COUNT=$(git diff --cached --numstat | wc -l | tr -d ' ')
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "data: add $COUNT articles ($DATE)"

          git push
          echo "no_changes=false" >> $GITHUB_OUTPUT