[project]
name = "personal-knowledgebase"
version = "0.1.0"
description = "个人 AI 知识库助手系统 - 自动从 GitHub Trending、Hacker News 等采集 AI/LLM/Agent 技术动态，AI 分析后结构化存储"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "wangtianyi"},
]
dependencies = [
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "openai>=1.0.0",
    "langgraph>=0.0.20",
    "pyyaml>=6.0",
    "python-dateutil>=2.8.0",
]

[project.scripts]
validate-json = "hooks.validate_json:main"

[tool.hatch.build.targets.wheel]
packages = ["hooks"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
